<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#050b15" />
<title>焚き火タイマー</title>
<style>
:root{--orange:#ff9f43;--ink:#f2eee8;--fire:1;font-family:"Yu Gothic","Hiragino Kaku Gothic ProN",system-ui,sans-serif;color:var(--ink);background:#03060a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #ffd08b;outline-offset:4px}
.app{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;overflow:hidden;isolation:isolate;background:#05070b}
.light{position:absolute;inset:0;z-index:-2;pointer-events:none;opacity:var(--fire);
background:radial-gradient(ellipse 85% 48% at 50% 100%,rgba(255,105,25,.5),transparent 70%),radial-gradient(ellipse 60% 70% at 50% 105%,rgba(255,150,50,.28),transparent 75%)}
#sparks{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
.head{text-align:center;padding:max(26px,env(safe-area-inset-top)) 16px 0;z-index:3}
h1{margin:0;font-size:clamp(22px,5.6vw,30px);font-weight:300;letter-spacing:.32em;text-indent:.32em}
.sub{margin:12px 0 0;font-size:13px;letter-spacing:.3em;color:rgba(206,224,240,.62)}
.sound{position:absolute;top:max(18px,env(safe-area-inset-top));right:14px;z-index:4;min-height:36px;padding:0 12px;border:1px solid rgba(255,255,255,.18);border-radius:99px;background:rgba(4,10,17,.3);font-size:11px;cursor:pointer;backdrop-filter:blur(10px)}
.sound[aria-pressed=true]{border-color:rgba(255,180,91,.6);color:#ffd9a4}
.timer-wrap{position:relative;z-index:3;display:grid;place-items:center;width:min(66vw,320px);aspect-ratio:1;margin-top:26px}
.ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--orange) var(--p,0%),rgba(199,210,219,.3) var(--p,0%) 100%);
-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 4px),#000 calc(100% - 3px));filter:drop-shadow(0 0 6px rgba(255,155,58,.25))}
.core{display:grid;justify-items:center;gap:10px}
.time{font-variant-numeric:tabular-nums;font-size:clamp(52px,16vw,76px);font-weight:300;letter-spacing:.04em;line-height:.9;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.total{font-size:15px;letter-spacing:.2em;color:rgba(240,236,230,.6)}
.hint{z-index:3;min-height:18px;margin:14px 0 0;font-size:12px;letter-spacing:.14em;color:rgba(235,226,213,.62);text-align:center}
.done{position:absolute;left:50%;top:60%;z-index:5;width:90%;transform:translate(-50%,-50%);text-align:center;opacity:0;pointer-events:none;transition:opacity 2.5s ease 2s}
.done strong{display:block;font-size:clamp(20px,5vw,28px);font-weight:300;letter-spacing:.2em}
.done span{display:block;margin-top:10px;font-size:13px;letter-spacing:.12em;color:rgba(206,224,240,.7)}
.is-done .done{opacity:1}.is-done .ring{opacity:.3}
.controls{z-index:3;width:min(100% - 36px,500px);margin-top:auto;padding:0 0 max(22px,env(safe-area-inset-bottom))}
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.preset{min-height:52px;border:1px solid rgba(255,255,255,.22);border-radius:99px;background:rgba(9,10,12,.55);font-size:15px;letter-spacing:.06em;cursor:pointer;backdrop-filter:blur(8px);transition:border-color .2s,background .2s}
.preset.on{border-color:var(--orange);background:linear-gradient(130deg,rgba(255,166,77,.34),rgba(80,38,15,.5));box-shadow:0 0 18px rgba(255,136,42,.2)}
.custom{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0;font-size:12px;color:rgba(233,226,218,.6)}
.custom input{width:84px;padding:8px 10px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(0,0,0,.35);color:var(--ink);text-align:center}
.start{display:block;width:100%;min-height:62px;border:1px solid rgba(255,193,130,.5);border-radius:99px;background:linear-gradient(100deg,rgba(110,57,28,.55),rgba(30,24,20,.7));font-size:16px;letter-spacing:.34em;text-indent:.34em;cursor:pointer;box-shadow:inset 0 1px rgba(255,255,255,.12);transition:background .25s,transform .2s}
.start:hover{background:linear-gradient(100deg,rgba(160,78,29,.65),rgba(40,30,24,.78))}.start:active{transform:scale(.99)}
.reset{display:block;margin:12px auto 0;border:0;background:none;font-size:12px;letter-spacing:.1em;text-decoration:underline;text-underline-offset:4px;color:rgba(233,226,218,.55);cursor:pointer}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="light"></div><canvas id="sparks"></canvas>
  <button class="sound" id="soundBtn" type="button" aria-pressed="true">音あり</button>
  <header class="head"><h1>焚き火タイマー</h1><p class="sub">スマホを置いて、ひと休み。</p></header>
  <div class="timer-wrap" aria-live="polite"><div class="ring" id="ring"></div>
    <div class="core"><div class="time" id="time">05:00</div><div class="total" id="total">/ 05:00</div></div></div>
  <p class="hint" id="hint">火を見つめて、ゆっくり呼吸する</p>

  <div class="done"><strong>ひと休み、完了。</strong><span>焚き火が静かに消えました</span></div>

  <section class="controls">
    <div class="presets" role="group" aria-label="時間のプリセット">
      <button class="preset" data-m="1" type="button">1分</button>
      <button class="preset on" data-m="5" type="button">5分</button>
      <button class="preset" data-m="10" type="button">10分</button>
    </div>
    <div class="custom"><label for="cm">自由設定</label><input id="cm" type="number" min="1" max="180" inputmode="numeric" placeholder="分" /><span>分</span></div>
    <button class="start" id="start" type="button">START</button>
    <button class="reset" id="reset" type="button">リセット</button>
  </section>
</main>

<script>
(() => {
const $ = id => document.getElementById(id);
const app = $('app'), ring = $('ring'), timeEl = $('time'), totalEl = $('total'), hint = $('hint'), startBtn = $('start'), cm = $('cm'), soundBtn = $('soundBtn');
const presets = [...document.querySelectorAll('.preset')];
let minutes = 5, total = 300, remain = 300, endAt = 0, tid = null, running = false, soundOn = true, wake = null;

/* ========== 火の粉：2D Canvas ========== */
const sc = $('sparks'), sx = sc.getContext('2d'), sparks = [];
let W = 0, H = 0, dpr = 1;
const fit = () => { dpr = Math.min(window.devicePixelRatio || 1, 2); W = sc.clientWidth; H = sc.clientHeight; sc.width = W * dpr; sc.height = H * dpr; };
window.addEventListener('resize', fit); fit();
const spawnSpark = () => sparks.push({
  x: W / 2 + (Math.random() - .5) * W * .22, y: H * (.9 + Math.random() * .08),
  vx: (Math.random() - .5) * .7, vy: -(Math.random() * 1.8 + .8),
  s: Math.random() * 1.8 + .7, age: 0, life: Math.random() * 160 + 90, ph: Math.random() * 6.28, f: Math.random() * .05 + .015
});

/* ========== 画面の明滅 + 火の粉ループ ========== */
let fk = 1, last = performance.now(), t0 = last;
const loop = now => {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = (now - t0) / 1000;
  const target = app.classList.contains('is-done') ? 0 : 1;
  fk += (target - fk) * (1 - Math.exp(-dt * (target ? 2 : .55)));
  if (fk < .004) fk = 0;
  const fl = .82 + .08 * Math.sin(t * 9.7) + .06 * Math.sin(t * 4.3 + 1.7) + .05 * Math.sin(t * 17.1 + 4) + (Math.random() - .5) * .06;
  app.style.setProperty('--fire', (fk * fl).toFixed(3));
  sx.setTransform(dpr, 0, 0, dpr, 0, 0); sx.clearRect(0, 0, W, H);
  if (Math.random() < .5 * fk) spawnSpark();
  sx.globalCompositeOperation = 'lighter';
  for (let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i]; p.age++;
    p.x += p.vx + Math.sin(p.age * p.f + p.ph) * .7; p.y += p.vy; p.vy *= .997;
    const a = 1 - p.age / p.life;
    if (a <= 0 || p.y < -10) { sparks.splice(i, 1); continue; }
    const g = sx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.s * 4);
    g.addColorStop(0, `rgba(255,${150 + 90 * a | 0},60,${a})`); g.addColorStop(1, 'rgba(255,90,20,0)');
    sx.fillStyle = g; sx.fillRect(p.x - p.s * 4, p.y - p.s * 4, p.s * 8, p.s * 8);
  }
  requestAnimationFrame(loop);
};
requestAnimationFrame(loop);

    A.timer = setInterval(() => { if (A.ctx.currentTime > A.next - 4) spawn(A.next, false); }, 500);
  }
  A.master.gain.cancelScheduledValues(A.ctx.currentTime);
  A.master.gain.setTargetAtTime(2.2, A.ctx.currentTime, .8);
};
const stopSound = (tc = .5) => {
  if (!A) return;
  A.master.gain.cancelScheduledValues(A.ctx.currentTime);
  A.master.gain.setTargetAtTime(0, A.ctx.currentTime, tc);
  setTimeout(() => { if (!running && A.ctx.state === 'running') A.ctx.suspend(); }, tc * 1000 * 5);
};

/* ========== タイマー ========== */
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const render = () => {
  timeEl.textContent = fmt(remain); totalEl.textContent = '/ ' + fmt(total);
  ring.style.setProperty('--p', (total ? (1 - remain / total) * 100 : 0) + '%');
  document.title = running ? fmt(remain) + ' · 焚き火タイマー' : '焚き火タイマー';
};
const lock = async () => { try { wake = await navigator.wakeLock?.request('screen'); } catch (e) {} };
const unlock = () => { try { wake?.release(); } catch (e) {} wake = null; };
document.addEventListener('visibilitychange', () => { if (running && document.visibilityState === 'visible') lock(); });

const finish = () => {
  clearInterval(tid); running = false; remain = 0;
  app.classList.add('is-done'); startBtn.textContent = 'もう一度';
  hint.textContent = ''; stopSound(1.6); unlock(); render();
};
const tick = () => { remain = Math.max(0, Math.ceil((endAt - Date.now()) / 1000)); render(); if (!remain) finish(); };
const reset = () => {
  clearInterval(tid); running = false; total = remain = minutes * 60;
  app.classList.remove('is-done'); startBtn.textContent = 'START';
  hint.textContent = '火を見つめて、ゆっくり呼吸する'; stopSound(.25); unlock(); render();
};
const start = async () => {
  if (app.classList.contains('is-done')) reset();
  if (running) {
    running = false; clearInterval(tid); stopSound(); unlock();
    startBtn.textContent = '再開'; hint.textContent = '一時停止中'; return;
  }
  running = true; endAt = Date.now() + remain * 1000;
  startBtn.textContent = '一時停止'; hint.textContent = 'スマホを伏せて、火の音に耳をすます';
  tid = setInterval(tick, 250); tick(); lock(); await startSound();
};
const setMin = m => {
  if (running) return;
  minutes = Math.min(180, Math.max(1, Math.round(m)));
  total = remain = minutes * 60; app.classList.remove('is-done'); startBtn.textContent = 'START';
  presets.forEach(p => p.classList.toggle('on', +p.dataset.m === minutes));
  cm.value = presets.some(p => +p.dataset.m === minutes) ? '' : minutes; render();
};
presets.forEach(p => p.addEventListener('click', () => setMin(+p.dataset.m)));
cm.addEventListener('change', () => cm.value && setMin(+cm.value));
startBtn.addEventListener('click', start); $('reset').addEventListener('click', reset);
soundBtn.addEventListener('click', () => {
  soundOn = !soundOn; soundBtn.setAttribute('aria-pressed', soundOn); soundBtn.textContent = soundOn ? '音あり' : '音なし';
  if (!soundOn) stopSound(); else if (running) startSound();
});
render();
})();
</script>
</body>
</html>
